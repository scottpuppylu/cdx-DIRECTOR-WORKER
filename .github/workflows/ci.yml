name: cdxdw verification

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: '3.9'}
          - {os: windows-latest, python: '3.12'}
          - {os: ubuntu-22.04, python: '3.9'}
          - {os: ubuntu-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -B -X utf8 tools/cdx_manifest.py --check
      - run: python -I -B -X utf8 tools/selftest_cdx.py --verbose
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I -B -X utf8 tools/selftest.py
